server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 20
      min-spare: 5

spring:
  application:
    name: livo-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true

  # Datasource Configuration (PostgreSQL / Supabase via Pooler)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      connection-test-query: SELECT 1
      pool-name: LivoHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

# Actuator & Keep-Alive Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Application-specific Properties
livo:
  jwt:
    secret: ${JWT_SECRET:your-default-dev-secret-key-minimum-32-chars-long!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  ai:
    gemini-api-key: ${AI_GEMINI_API_KEY:${GEMINI_API_KEY:}}
    gemini-model: ${GEMINI_MODEL:gemini-3.6-flash}
    groq-api-key: ${AI_GROQ_API_KEY:${GROQ_API_KEY:}}
    daily-quota: ${AI_QUOTA_PER_DAY:20}
  cloudinary:
    url: ${CLOUDINARY_URL:}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.livo.app,https://livo.app,capacitor://localhost,ionic://localhost}

firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:serviceAccountKey.json}
